name: Build and Test API
on:
  pull_request:
    paths:
      - "components/api/**"
      # - ".github/workflows/api-ci.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: components/api
    steps:
      - name: Checkout the repo
        uses: actions/checkout@v4
      - name: install deps
        run: npm ci
      - name: run tests
        run: npm run test:coverage
      - name: Upload Code Coverage Report
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: components/api/coverage/coverage.cobertura.xml
          format: markdown
          thresholds: '60'

  build-api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [test-api]
    defaults:
      run:
        working-directory: components/api
    steps:
      - name: Checkout the repo
        uses: actions/checkout@v4
      - name: cache deps
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: components/api/package-lock.json
      - name: install deps
        run: npm ci
      - name: build api
        run: npm run build
      - name: upload useful build outputs
        uses: actions/upload-artifact@v4
        with:
          name: api build outputs
          path: components/api/dist/