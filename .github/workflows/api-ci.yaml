name: Build and Test API
on: 
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-changes:
    runs-on: ubuntu-latest
    outputs:
      api: ${{steps.changes.outputs.api}}
    steps:
      - name: Check changes
        uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            api:
              - 'components/api/**'

  test-api:
    needs: [check-changes]
    if: needs.check-changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: components/api
    steps:
      - name: Checkout the repo
        uses: actions/checkout@v4
      - name: install deps
        run: npm ci
      - name: run tests
        run: npm run test:coverage
      - name: upload code coverage
        uses: actions/upload-artifact@v4
        with:
          name: api-coverage
          path: | 
            components/api/coverage
      - name: display coverage report
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: components/api/coverage/cobertura-coverage.xml
          thresholds: 50
          fail_below_min: true

  build-api:
   needs: [test-api]
   runs-on: ubuntu-latest
   timeout-minutes: 15
   defaults:
    run:
      working-directory: components/api
   steps:
    - name: Checkout the repo
      uses: actions/checkout@v4
    - name: cache deps
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: components/api/package-lock.json
    - name: install deps
      run: npm ci
    - name: build api
      run: npm run build

