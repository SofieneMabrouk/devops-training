name: "Setup Node Project"
description: "A composite action to setup a Node.js project with caching"
inputs:
  workdir:
    description: "Working directory of the Node.js project (relative to repo root)"
    required: true
  node-version:
    description: "Node.js version to use"
    required: true
    default: "20"
runs:
  using: "composite"
  steps:
    - name: cache deps
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: "npm"
        cache-dependency-path: ${{ github.workspace }}/${{ inputs.workdir }}/package-lock.json
    - name: install deps
      shell: bash
      run: npm ci
